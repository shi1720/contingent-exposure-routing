[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contingent-exposure-routing"
version = "0.1.0"
description = "Reproducible outage-contingent exposure routing experiments for financial AI systems"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "pandas", "cvxpy", "clarabel", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
